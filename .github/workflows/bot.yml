name: "🤖 Run Bot 24/7"

on:
  workflow_dispatch:
  schedule:
    # هر ۶ ساعت یک‌بار ربات دوباره روشن می‌شود (به وقت UTC) تا ۲۴/۷ آنلاین بماند
    - cron: "0 */6 * * *"
  push:
    branches: ["main", "master"]
    paths-ignore:
      - "data.json"
      - "**.md"

# اگر ران جدیدی شروع شود، ران قبلی خودکار بسته می‌شود تا دو نسخه همزمان ران نشوند
concurrency:
  group: bot-runner
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - name: 📥 Download code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install requirements
        run: pip install -r requirements.txt

      - name: 🚀 Start bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bot.py
